[profile.default]
src = "contracts/src"
out = "contracts/out"
libs = ["contracts/lib"]
test = "contracts/test"
script = "contracts/script"
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
